<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Astra · Atlas de referência Unity</title>
<style>
:root{color-scheme:dark;--bg:#171b21;--panel:#232832;--line:#39414e;--text:#eef1f5;--muted:#aeb8c6;--lime:#9bea43}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 system-ui,sans-serif}header{padding:18px 24px;border-bottom:1px solid var(--line);background:#101318;display:flex;align-items:center;gap:20px;flex-wrap:wrap}h1{font-size:23px;margin:0}h1 b{color:var(--lime)}header span{color:var(--muted)}button,input,select{font:inherit;color:inherit;border:1px solid var(--line);background:var(--panel);border-radius:9px;padding:9px 12px}button,a{cursor:pointer}button:hover,button.active{border-color:var(--lime)}a{color:#aee886}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--lime);outline-offset:2px}.bar{padding:14px 22px;display:flex;gap:9px;flex-wrap:wrap}.bar input{flex:1;min-width:220px}.shell{display:grid;grid-template-columns:330px minmax(0,1fr);height:calc(100vh - 153px)}nav{border-right:1px solid var(--line);overflow:auto;padding:10px}nav button{width:100%;text-align:left;border-color:transparent;margin-bottom:5px;padding:10px 12px;background:transparent}nav button.active{background:#2a3730}nav small{display:block;color:var(--muted);font-size:10px;overflow-wrap:anywhere}main{overflow:auto;padding:24px 30px}h2{font-size:26px;margin:0 0 9px;overflow-wrap:anywhere}h3{font-size:17px;margin:26px 0 10px}.tag{border:1px solid var(--line);border-radius:6px;padding:3px 7px;font-size:12px;display:inline-block;margin:0 6px 5px 0;color:var(--muted)}.notice{background:#2a3028;border-left:3px solid var(--lime);padding:13px 16px;margin:15px 0;color:#d7e1cf}.warn{background:#393125;border-left-color:#ffd070}.muted{color:var(--muted)}table{border-collapse:collapse;width:100%;font-size:12px}td,th{padding:9px 10px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top;overflow-wrap:anywhere}th{color:var(--muted);font-weight:500;background:#20252d;position:sticky;top:0}code{color:#c8e6af;white-space:pre-wrap;overflow-wrap:anywhere}.scroll{overflow:auto}details{border:1px solid var(--line);border-radius:10px;padding:12px;margin:9px 0}summary{cursor:pointer}.links button{margin:3px;font-size:12px;padding:5px 8px}.cols{display:grid;grid-template-columns:1fr 1fr;gap:16px}p{max-width:100ch}.layoutGrid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.concept{background:#101419;border:1px solid var(--line);border-radius:18px;overflow:hidden;padding:14px}.concept h3{margin:0 0 12px}.mock{height:240px;display:grid;gap:5px;padding:6px;border-radius:10px;background:#303743}.mock div{background:#1e252e;border-radius:8px;padding:8px;color:#abb7c4;font-size:11px}.mock .view{background:#353e48;display:grid;place-items:center;color:#dae0e8}.mock .selected{box-shadow:inset 0 3px var(--lime)}.studio{grid-template-columns:21% 48% 1fr;grid-template-rows:28px 1fr 30px}.studio .top{grid-column:span 3}.studio .console{grid-column:span 3}.bench{grid-template-columns:64% 1fr;grid-template-rows:30px 1fr 40px}.bench .top,.bench .bottom{grid-column:span 2}.compare{grid-template-columns:1fr 1fr;grid-template-rows:32px 1fr 60px}.compare .top,.compare .bottom{grid-column:span 2}.focus{grid-template-columns:1fr;grid-template-rows:26px 24px 1fr 56px 25px;width:160px;margin:auto}.prose li{margin-bottom:10px}#more{margin:10px}.empty{padding:24px;color:var(--muted)}@media(max-width:850px){.shell{grid-template-columns:230px minmax(0,1fr)}main{padding:15px}.cols,.layoutGrid{grid-template-columns:1fr}}@media(max-width:580px){.shell{display:block;height:auto}nav{max-height:220px;border-bottom:1px solid var(--line)}main{overflow:visible}header{padding:14px}.bar{padding:12px}table{font-size:11px}}
</style>
<header><h1><b>ASTRA</b> / Atlas de referência</h1><span id="count"></span><button id="catalogButton">Catálogo</button><button id="layoutButton">Quatro direções de layout</button><button id="scopeButton">Cobertura e limites</button></header>
<section class="bar"><input id="query" type="search" placeholder="Tipo, propriedade, namespace ou dependência…" aria-label="Buscar no catálogo"><select id="category" aria-label="Categoria"><option value="Component">Componentes</option><option value="">Todos os tipos</option><option>Volume profile</option><option>UI Toolkit element</option><option>Resource / contract</option><option>Supporting type</option></select><select id="package" aria-label="Pacote"><option value="">Todos os pacotes</option></select></section>
<div class="shell"><nav id="list" aria-label="Resultados"></nav><main id="detail"></main></div>
<script id="data" type="application/json">__ATLAS_JSON__</script>
<script>
'use strict';const D=JSON.parse(document.getElementById('data').textContent),T=D.types,B=new Map(T.map(t=>[t.id,t])),$=s=>document.getElementById(s);let current='',limit=100;
const E=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const link=(id,label)=>B.has(id)?`<button data-type="${E(id)}">${E(label||B.get(id).fullName)}</button>`:E(label||id);
const src=s=>`<a href="${E(s.url)}${s.url.includes('github.com')?'#L'+s.line:''}" target="_blank" rel="noopener">${E(s.path)}:${s.line}</a>`;
$('count').textContent=`${D.stats.categories.Component} tipos Component · ${D.stats.declaredMembers.toLocaleString('pt-BR')} propriedades/campos · 15/09/2026`;
for(const p of [...new Set(T.map(t=>t.package))].sort())$('package').insertAdjacentHTML('beforeend',`<option>${E(p)}</option>`);
const searchable=new Map(T.map(t=>[t.id,[t.fullName,t.package,...t.members.map(m=>m.name),...t.requires.map(x=>x)].join(' ').toLowerCase()]));
function filtered(){const q=$('query').value.toLowerCase().trim();return T.filter(t=>(!$('category').value||t.category===$('category').value)&&(!$('package').value||t.package===$('package').value)&&(!q||searchable.get(t.id).includes(q)))}
function renderList(){const items=filtered();$('list').innerHTML=`<div class="muted">${items.length} resultados</div>`+items.slice(0,limit).map(t=>`<button data-type="${E(t.id)}" class="${t.id===current?'active':''}">${E(t.name)}${t.abstract?' · base abstrata':''}<small>${E(t.package)} · ${E(t.category)}</small></button>`).join('')+(items.length>limit?'<button id="more">Mostrar mais 100</button>':'');if($('more'))$('more').onclick=()=>{limit+=100;renderList()}}
function members(t){if(!t.members.length)return '<p class="muted">Sem declarações próprias extraídas. Consulte as bases e os dados genéricos.</p>';return `<div class="scroll"><table><thead><tr><th>Propriedade / campo</th><th>Tipo</th><th>Acesso</th><th>Exposição / atributos</th></tr></thead><tbody>${t.members.map(m=>`<tr><td><code>${E(m.name)}</code></td><td><code>${E(m.type)}</code><div class="links">${t.typedReferences.filter(x=>x.property===m.name).map(x=>link(x.id)).join('')}</div></td><td>${m.public?((m.read?'R':'')+(m.write?'W':'')):'privado serializado'}${m.static?' · estático':''}</td><td>${E(m.exposure)}${m.hidden?' · oculto':''}<br>${E(m.attributes.join(', '))}</td></tr>`).join('')}</tbody></table></div>`}
function openType(id){const t=B.get(id);if(!t)return;current=id;location.hash=encodeURIComponent(id);renderList();$('detail').innerHTML=`<h2>${E(t.fullName)}</h2><span class="tag">${E(t.package)} ${E(t.version)}</span><span class="tag">${E(t.category)}</span>${t.abstract?'<span class="tag">Abstrato</span>':''}${t.obsolete?'<span class="tag">Obsoleto na fonte</span>':''}<p>${E(t.purpose||t.guide.name)}</p><div class="notice">${E(t.astraStatus)} API pública, serialização e interface do Inspector são contratos diferentes.</div>${t.sourceRecoveryWarning?'<div class="notice warn">Esta fonte teve recuperação sintática/preprocessador. A ficha exige confronto com a fonte antes de virar contrato implementável.</div>':''}<p><b>Caminho da família:</b> ${E(t.guide.workflow)}</p><p><b>Infraestrutura:</b> ${E(t.guide.dependencies)} · <b>Roadmap:</b> ${E(t.guide.roadmap)}</p><p class="muted">${E(t.guide.review)}</p><div class="cols"><section><h3>Dependências obrigatórias declaradas</h3><div class="links">${t.requiresResolved.map(x=>link(x.id,x.name)).join('')||'Nenhum RequireComponent nesta declaração.'}</div><p>Herdadas:</p><div class="links">${t.inheritedRequirements.map(x=>link(x.id,x.name)+' <small>via '+E(B.get(x.declaredBy)?.name||x.declaredBy)+'</small>').join('<br>')||'—'}</div><h3>Quem exige este componente</h3><div class="links">${t.requiredBy.map(x=>link(x)).join('')||'Nenhum atributo resolvido neste recorte.'}</div></section><section><h3>Herança</h3><code>${E(t.bases.join(', '))||'—'}</code><div class="links">${t.baseIds.map(x=>link(x)).join('')}</div><p><b>Menu:</b> ${E(t.addMenu??t.menuStatus)}</p><p class="muted">Ausência de atributo não prova ausência de requisitos funcionais. Tipos abstratos, internos de apoio e recursos não viram opções Add.</p></section></div><h3>Propriedades e campos declarados (${t.members.length})</h3>${members(t)}${t.ancestorIds.filter(x=>B.has(x)).map(x=>`<details><summary>Herdadas de ${E(B.get(x).fullName)} (${B.get(x).members.length})</summary>${members(B.get(x))}</details>`).join('')}${t.enumValues.length?'<h3>Valores do enum</h3><code>'+E([...new Set(t.enumValues)].join(' · '))+'</code>':''}<details><summary>Quem referencia este tipo (${t.referencedBy.length}) — relação tipada, não obrigatoriedade</summary><div class="links">${t.referencedBy.map(x=>link(x.id,(B.get(x.id)?.fullName||x.id)+'.'+x.property)).join('')||'—'}</div></details><details><summary>Derivações diretas (${t.derivedBy.length})</summary><div class="links">${t.derivedBy.map(x=>link(x)).join('')}</div></details><details><summary>Métodos públicos declarados (${t.methods.length})</summary>${t.methods.map(m=>'<p><code>'+E(m.returns+' '+m.name+m.parameters)+'</code></p>').join('')}</details>${t.apiDocumentation?`<details><summary>Índice da API oficial consultada</summary><a href="${E(t.apiDocumentation.url)}">Abrir página oficial</a>${t.apiDocumentation.sections.map(s=>'<h3>'+E(s.section)+(s.inherited?' · herdados':'')+'</h3>'+s.members.map(m=>'<a target="_blank" rel="noopener" href="'+E(m.url)+'">'+E(m.name)+'</a>').join(' · ')).join('')}</details>`:''}<h3>Fontes consultadas</h3>${t.sources.map(s=>'<p>'+src(s)+'</p>').join('')}<p class="muted">Nos pacotes de registro, o link conduz ao índice da API; o arquivo e linha identificam a fonte do arquivo .tgz fixado em Cobertura. Nenhum corpo de implementação Unity foi incorporado aqui.</p>`;$('detail').scrollTop=0}
document.addEventListener('click',e=>{const b=e.target.closest('[data-type]');if(b)openType(b.dataset.type)});
for(const id of ['query','category','package'])$(id).addEventListener('input',()=>{limit=100;renderList()});
$('scopeButton').onclick=()=>{$('detail').innerHTML='<h2>Cobertura verificável</h2><p>O catálogo é amplo, mas não representa todo código que alguém pode instalar ou escrever para Unity. As versões abaixo fecham este recorte.</p><pre>'+E(JSON.stringify(D.stats,null,2))+'</pre><ul class="prose">'+D.limits.map(x=>'<li>'+E(x)+'</li>').join('')+'</ul><h3>Fontes e dependências de pacote</h3>'+D.manifests.map(m=>'<details><summary>'+E(m.package+' · '+m.version)+'</summary><a target="_blank" href="'+E(m.source)+'">Fonte fixada</a><pre>'+E(JSON.stringify(m,null,2))+'</pre></details>').join('');$('detail').scrollTop=0};
$('layoutButton').onclick=()=>{$('detail').innerHTML=`<h2>Quatro composições para a Astra</h2><p>Estudos de organização do espaço. São esquemas para comparar fluxos; acabamento, ícones e previews finais devem seguir o IDE aprovado. Não são capturas da aplicação.</p><div class="layoutGrid"><section class="concept"><h3>1 · Estúdio</h3><div class="mock studio"><div class="top">ASTRA　Projeto / Cena　　　　　　　　　Play</div><div>Objetos<br>▾ Veículo<br>　Porta<br>　Rodas</div><div class="view">Cena + câmera visível<br>prévia fixável</div><div class="selected">Câmera<br>Geral　Lente<br><br>Projeção<br>Perspectiva<br><br>FOV　60°</div><div class="console">Console　Problemas　Tarefas</div></div><p>Dock contextual, aba conectada ao corpo, cartões recolhíveis e preview próximo ao objeto.</p></section><section class="concept"><h3>2 · Bancada de recursos</h3><div class="mock bench"><div class="top">Ford.glb　/　Malha / Carroceria</div><div class="view">Preview isolado<br>UV · Normais · Materiais</div><div class="selected">Malha<br>Superfícies<br>LOD<br>Colisão</div><div class="bottom">[Carroceria]　[Porta]　[Vidro]　[Roda]</div></div><p>Ferramentas de malha/textura têm espaço de trabalho próprio e breadcrumbs até o objeto usuário.</p></section><section class="concept"><h3>3 · Comparação</h3><div class="mock compare"><div class="top">Reimportar　　Origem → Projeto　　3 conflitos</div><div class="view">Versão anterior</div><div class="view">Candidata</div><div class="bottom">Porta / pivô　　Manter local<br>Material / vidro　　Usar origem</div></div><p>Decisões sobre alterações em árvore e imagem. Expande a operação difícil sem criar botões permanentes.</p></section><section class="concept"><h3>4 · Foco em retrato</h3><div class="mock focus"><div>ASTRA　Camera.cs</div><div class="selected">Código　Objeto　Console</div><div class="view">Editor / painel ativo</div><div>Teclado e atalhos<br>sem cobrir o campo</div><div>Estado　　Busca　　⋯</div></div><p>Uma superfície ativa, contexto preservado e transições reversíveis; adequado ao telefone com IME.</p></section></div><h3>Regras comuns de construção</h3><p>Recortes de 10–16 dp, grupos de campos com alinhamento, rótulos de contexto curtos, imagens raster transparentes, uma ação primária por operação e status fora dos botões. A personalização reorganiza painéis e ferramentas sem alterar o documento.</p>`;$('detail').scrollTop=0};
$('catalogButton').onclick=()=>openType(current||T.find(t=>t.fullName==='UnityEngine.Camera').id);
renderList();openType(decodeURIComponent(location.hash.slice(1))||T.find(t=>t.fullName==='UnityEngine.Camera').id);
</script></html>
