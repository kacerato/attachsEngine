ites, tilemap e Canvas; não todos os objetos possíveis de scripts ou plugins.", "A documentação versionada pode reutilizar capturas de versões anteriores.", "Capturas complementares da documentação Unity 2022.3 e 2019.4 são identificadas por imagem; não comprovam a aparência atual da Unity 6.", "Endereços HTTP 404/410 foram excluídos da visualização. Algumas verificações HEAD tiveram HTTP 429 (limite temporário de requisições); o carregamento da galeria depende da disponibilidade do servidor oficial."]}</script>
<script>
const data=JSON.parse(document.getElementById('data').textContent),records=data.records;
const $=id=>document.getElementById(id),escape=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let selected='',mode='single';
$('intro').textContent=`Unity 6.0 e pacotes do inventário Astra: ${data.stats.components} fichas de componentes, ${data.stats.componentsWithImages} com imagens localizadas e ${data.stats.uniqueImages} imagens distintas. Inclui bases, tipos ocultos e obsoletos.`;
for(const p of [...new Set(records.map(r=>r.package))].sort()){const o=document.createElement('option');o.value=p;o.textContent=p==='UnityEngine'?'Unity — núcleo':p.replace('com.unity.','');$('package').append(o)}
function filtered(){const q=$('search').value.toLowerCase().trim();return records.filter(r=>(!q||`${r.name} ${r.fullName} ${r.package}`.toLowerCase().includes(q))&&(!$('group').value||r.group===$('group').value)&&(!$('package').value||r.package===$('package').value)&&(!$('photosOnly').checked||r.images.length)).sort((a,b)=>a.name.localeCompare(b.name))}
function flags(r){return[r.abstract?'Tipo abstrato':'',r.obsolete?'Obsoleto':'',r.menuStatus==='hidden'?'Oculto no inventário':''].filter(Boolean).join(' · ')}
function error(img){const p=document.createElement('div');p.className='image-error';p.textContent='Não foi possível carregar a imagem remota. Use o link da imagem ou da fonte oficial.';img.replaceWith(p)}
function bindErrors(){document.querySelectorAll('main img').forEach(i=>i.addEventListener('error',()=>error(i)))}
function list(){const rows=filtered();$('indexHeading').textContent=`${rows.length} fichas · ${rows.filter(r=>r.images.length).length} com imagens`;$('index').innerHTML=rows.length?rows.map(r=>`<button class="entry" data-id="${escape(r.id)}" aria-pressed="${r.id===selected}"><strong>${escape(r.name)}</strong><small>${r.images.length} imagens · ${escape(r.group)}${r.abstract?' · base abstrata':''}</small></button>`).join(''):'<p class="empty">Nenhuma ficha encontrada. Ajuste a busca ou os filtros.</p>';$('index').querySelectorAll('button').forEach(b=>b.onclick=()=>show(b.dataset.id));return rows}
function show(id){selected=id;mode='single';list();const r=records.find(r=>r.id===id);if(!r)return;location.hash=encodeURIComponent(id);const docs=r.pages.filter(p=>p.status===200);$('main').innerHTML=`<h2>${escape(r.name)}</h2><p class="meta">${escape(r.package)} · ${escape(r.version)}${flags(r)?' · '+escape(flags(r)):''}</p><div class="source"><a href="${escape(docs[0]?.url||r.source)}" target="_blank" rel="noopener">Abrir fonte oficial ↗</a>${docs[0]?`<a href="${escape(r.source)}" target="_blank" rel="noopener">Código / referência do tipo ↗</a>`:''}</div><div class="notes">${r.group==='Componentes'?'As imagens abaixo vêm de páginas associadas ao tipo. Podem mostrar o Inspector, exemplos de uso ou diagramas; não garantem cobertura de todas as propriedades.':'Referências oficiais de objetos e do editor.'} ${r.images.length===0?'Nenhuma imagem localizada nas páginas consultadas. Veja a fonte oficial.':''}</div>${r.images.map((im,i)=>`<figure class="photo"><a href="${escape(im.url)}" target="_blank" rel="noopener"><img referrerpolicy="no-referrer" src="${escape(im.url)}" loading="${i?'lazy':'eager'}" alt="${escape(im.alt||r.name+' — imagem oficial '+(i+1))}"></a><figcaption>Imagem ${i+1} · Documentação ${escape(im.documentationVersion)} · <a href="${escape(im.page)}" target="_blank" rel="noopener">Página de origem ↗</a>${im.status!==200?' · endereço não confirmado na verificação HTTP':''}</figcaption></figure>`).join('')}<details><summary>Páginas consultadas (${r.pages.length})</summary><ul>${r.pages.map(p=>`<li><a href="${escape(p.url)}" target="_blank" rel="noopener">${escape(p.url)}</a> · HTTP ${p.status||'sem resposta'}</li>`).join('')}</ul></details>`;bindErrors();$('main').scrollTop=0}
function mosaic(){mode='all';selected='';const rows=list(),seen=new Set(),images=[];for(const r of rows)for(const im of r.images)if(!seen.has(im.url)){seen.add(im.url);images.push({r,im})}$('main').innerHTML=`<h2>Todas as imagens</h2><p class="count">${images.length} imagens distintas nos filtros atuais. Clique no nome para abrir a ficha; clique na imagem para ampliá-la.</p><div class="mosaic">${images.map(({r,im})=>`<figure><a href="${escape(im.url)}" target="_blank" rel="noopener"><img referrerpolicy="no-referrer" src="${escape(im.url)}" loading="lazy" alt="${escape(im.alt||r.name)}"></a><figcaption><button data-id="${escape(r.id)}">${escape(r.name)}</button><small>${escape(r.package.replace('com.unity.',''))} · ${escape(im.documentationVersion)}</small><a href="${escape(im.page)}" target="_blank" rel="noopener">Fonte oficial ↗</a></figcaption></figure>`).join('')}</div>`;document.querySelectorAll('main button').forEach(b=>b.onclick=()=>show(b.dataset.id));bindErrors()}
function update(){const rows=list();if(mode==='all')mosaic();else if(!rows.some(r=>r.id===selected)){if(rows.length)show(rows[0].id);else $('main').innerHTML='<h2>Nenhum resultado</h2><p>Ajuste os filtros. Desmarque “Com imagens” para consultar também as fichas sem imagens.</p>'}}
for(const id of ['search','group','package','photosOnly'])$(id).addEventListener(id==='search'?'input':'change',update);$('allPhotos').onclick=mosaic;
const hash=decodeURIComponent(location.hash.slice(1)),initial=records.find(r=>r.id===hash)||records.find(r=>r.name==='Inspector — edição de componentes'&&r.images.length)||records.find(r=>r.group==='Inspector'&&r.images.length)||records.find(r=>r.images.length);if(initial)show(initial.id);else update();
</script>
